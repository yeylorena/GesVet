<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"/>

<head th:replace="~{Plantillas/administrador :: head}"></head>

<body style="background-color: #5DADE2;">

    <!-- ======= Header ======= -->
    <header th:replace="~{Plantillas/administrador :: header}"></header><!-- End Header -->

    <!-- ======= Sidebar ======= -->
    <aside th:replace="~{Plantillas/administrador :: sidebar}"></aside><!-- End Sidebar-->

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Consultas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="inicio.html">Inicio</a></li>
                    <li class="breadcrumb-item">Consultas</li>
                    <li class="breadcrumb-item">Clientes</li>
                </ol>
            </nav>
        </div><!-- End Page Title -->
        <section class="section profile">

            <div class="card">
                <div class="card-body pt-3">
                    <!-- los dos div blancos -->
                    <ul class="nav nav-tabs nav-tabs-bordered">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#profile-overview">Consultar
                                clientes</button>
                        </li>
                    </ul>
                    <div class="tab-content pt-2">
                        <br>
                            <!-- inicio de Consultar clientes  -->
                            <div class="tab-pane fade show active profile-overview" id="profile-overview">
                                <div class="container-fluid mt-3">
                                    <p class="textoNeon">Clientes</p>
                                </div>
                                <div class="container-fluid">
                                    <div class="table-responsive">
                                        <div class="card-body">
                                            <div class="search-bar">
                                                <form class="search-form d-flex align-items-center">
                                                    <input type="text" name="query" placeholder="Buscar cliente" title="Enter search keyword">
                                                        <button class="btn" type="submit" title="Search"><i class="bi bi-search"></i></button>
                                                </form>
                                            </div>

                                            <table class="table table-striped table-hover text-start">
                                                <thead>
                                                    <tr>
                                                        <th>#</th>
                                                        <th scope="col" class="text-center">Email</th>
                                                        <th scope="col">Nombre</th>
                                                        <th scope="col">Apellido</th>
                                                        <th scope="col">Dirección</th>
                                                        <th scope="col">Teléfono</th>
                                                        <th scope="col">Mascotas</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <!-- Iterar sobre la lista de usuarios y mostrar cada uno -->
                                                    <tr th:each="usuario,iterStat : ${usuarios}">
                                                        <td th:text="${iterStat.index + 1}"></td>
                                                        <td th:text="${usuario.username}"></td>
                                                        <td th:text="${usuario.nombre}"></td>
                                                        <td th:text="${usuario.apellido}"></td>
                                                        <td th:text="${usuario.direccion}"></td>
                                                        <td th:text="${usuario.telefono}"></td>
                                                        <!-- Iterar sobre la lista de mascotas asociadas a este usuario -->
                                                        <td>
                                                            <button class="btn btn-primary" 
                                                                    th:attr="data-usuario-id=${usuario.id}"
                                                                    onclick="mostrarMascotas(this.getAttribute('data-usuario-id'))">Ver</button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>                              
                                        </div> <!-- End card-body -->
                                    </div><!-- End table-responsive -->
                                </div><!-- End container-fluid -->
                            </div> <!-- final de Consultar clientes  -->
                    </div>  <!-- End tab content  -->
                </div> <!-- End card-body pt-3 -->
            </div><!-- End card -->
        </section><!-- End section -->
        <div th:replace="~{Plantillas/administrador :: scripts}"></div>
    </main><!-- End #main -->
    <script th:inline="javascript">
        function mostrarMascotas(userId) {
            window.location.href = '/cliente/mascotas?userId=' + userId;
        }
    </script>
</body>
</html>
