    <body style="background-color: #2FC0D5;">

        <header th:replace="Plantillas/administrador :: header"></header> 

        <aside th:replace="Plantillas/administrador :: sidebar"></aside>

        <main id="main" class="main">

            <div class="pagetitle">
                <h1>Gestion Raza</h1>
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="inicio_vet.html">Inicio</a></li>
                        <li class="breadcrumb-item">Gestión Raza</li>
                        <li class="breadcrumb-item active">Agregar</li>
                    </ol>
                </nav>
            </div><!-- End Page Title -->

            <section class="section profile">
                <div class="col-xl-12">

                    <div class="card">
                        <div class="card-body pt-3">
                            <!-- Bordered Tabs -->
                            <ul class="nav nav-tabs nav-tabs-bordered">

                                <li class="nav-item">
                                    <button class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#profile-overview">Registro</button>
                                </li>
                            </ul>
                            <div class="tab-content pt-2">
                                <div class="container">
                                    <form th:action="@{/razas/save}" method="post" th:object="${raza}" enctype="multipart/form-data">
                                        <div class="card">

                                            <div class="form-group" style=" font-family: 'Montserrat', Arial, sans-serif;
                                                 font-size: 15px;
                                                 font-weight: 500;
                                                 line-height: 50px;
                                                 color: #000000;">
                                                <div class="row my-2">
                                                    <div class="col-6">
                                                        <label>Nombre:</label>
                                                        <input type="text" id="nombre" name="nombre" class="form-control" required>
                                                            <small id="nombreHel" class="form-text text-danger"
                                                                   style="display:none;">Por favor, ingrese solo letras y entre 3 y 20 caracteres.</small>
                                                    </div>
                                                    <div class="col-6">
                                                        <label>Descripción:</label>
                                                        <input type="text" id="descripcion" name="descripcion" class="form-control"required>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-group" style=" font-family: 'Montserrat', Arial, sans-serif;
                                                 font-size: 15px;
                                                 font-weight: 500;
                                                 line-height: 50px;
                                                 color: #000000;">
                                                <div class="row my-2">
                                                    <div class="col-6">
                                                        <label>Estado:</label>
                                                        <select name="estado" id="estado" class="form-control" required>
                                                            <option value="activo">Activo</option>
                                                            <option value="inactivo">Inactivo</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="box-footer">
                                                <div class="row my-2">
                                                    <div class="d-grid gap-2 col-6">
                                                        <button class="btn" id="guardarBtn" style="background-color:#2FD6B4">Guardar</button>
                                                        </div>
                                                        <div class="d-grid gap-2 col-6">
                                                            <a class="btn" style="background-color:#2FD6B4" href="/razas">Cancelar</a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div th:replace="Plantillas/administrador :: scripts"></div>

            </main><!-- End #main -->
            <script>
                const guardarBtn = document.getElementById('guardarBtn');

                guardarBtn.addEventListener('click', function () {
                    // Obtener los valores de los campos
                    const nombre = document.getElementById('nombre').value;
                    const descripcion = document.getElementById('descripcion').value;
                    const estado = document.getElementById('estado').value;

                    // Verificar si los campos están vacíos
                    if (nombre.trim() !== '' && descripcion.trim() !== '' && estado.trim() !== '') {
                        // Si los campos no están vacíos, mostrar la alerta de SweetAlert
                        Swal.fire({
                            title: 'Raza creada',
                            icon: 'success',
                            showCancelButton: false,
                            showConfirmButton: false,
                            timer: 1000000 // Cambia el tiempo de visualización de la alerta si lo deseas
                        });
                        // Aquí puedes agregar la lógica para guardar los datos si es necesario
                    } else {
                        // Si algún campo está vacío, mostrar una alerta de error
                        Swal.fire({
                            title: 'Error',
                            text: 'Por favor, completa todos los campos',
                            icon: 'error',
                            confirmButtonText: 'OK'
                        });
                    }
                });

            </script>

        </body>
    </html>
