<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"/>

<head>
    <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">

            <title> Usuario/Resgistro</title>
            <meta content="" name="description">
                <meta content="" name="keywords">

                    <!-- Google Fonts -->
                    <link href="https://fonts.gstatic.com" rel="preconnect">
                        <link
                            href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
                            rel="stylesheet">

                            <!-- Favicons -->
                            <link src="../img/productos_servicios/logo.png}" rel="icon"/>


                            <!-- Vendor CSS Files -->
                            <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
                                <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
                                    <link th:href="@{/assets/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
                                        <link th:href="@{/assets/vendor/quill/quill.snow.css}" rel="stylesheet">
                                            <link th:href="@{/assets/vendor/quill/quill.bubble.css}" rel="stylesheet">
                                                <link th:href="@{/assets/vendor/remixicon/remixicon.css}" rel="stylesheet">
                                                    <link th:href="@{/assets/vendor/simple-datatables/style.css}" rel="stylesheet">

                                                        <!-- Template Main CSS File -->
                                                        <link th:href="@{/assets/css/style.css}" rel="stylesheet">


                                                            </head>

                                                            <body style="background-color: #5DADE2;">
                                                                <main>
                                                                    <div class="container-fluid py-3">



                                                                        <div class="row col-md-12 justify-content-center ">

                                                                            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center ">

                                                                                <div class="card mb-3 ">
                                                                                    <div class="card-body " style="width: 400px; background: #FFFFFF;
                                                                                         border: 1px solid #000000;
                                                                                         box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
                                                                                         ">
                                                                                        <div class="col-12 py-1 d-flex align-items-center my-1">
                                                                                            <img th:src="@{/assets/img/logoGesVet.png}"

                                                                                                 style="width: 80px; margin-right: 15px; margin-bottom: 15px;">

                                                                                                <div>
                                                                                                    <h4 class="card-title fs-4 justify-content-between ">Crea una Cuenta</h4>
                                                                                                </div>
                                                                                        </div>
                                                                                        <p class="text-center small ustify-content-between mb-0"><h5>Ingresa la siguiente información para crear la cuenta:</h5>

                                                                                        </p>

                                                                                        <form    method="post"
                                                                                                 role="form"
                                                                                                 th:action="@{/register}"
                                                                                                 th:object="${user}"    class="row g-3 needs-validation py-2" novalidate>

                                                                                            <div class="col-12 py-2">
                                                                                                <label for="yourName" class="form-label">Email</label>
                                                                                                <input  th:field="*{username}" type="text" name="name" class="form-control" id="yourName" required>
                                                                                                    <span th:if="${userexist}" style="color: red;">El nombre de usuario ya está registrado</span>
                                                                                                    <div class="invalid-feedback">Escribe tu correo electrónico</div>
                                                                                            </div>
                                                                                            <div class="col-12 py-1">
                                                                                                <label for="password" class="form-label">Contraseña</label>
                                                                                                <input th:field="*{password}" type="password" name="password" class="form-control" id="password" required>
                                                                                                    <div class="invalid-feedback">Escribe tu contraseña</div>
                                                                                            </div>
                                                                                            <div class="col-12 py-1">
                                                                                                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                                                                                <input th:field="*{confirmPassword}" type="password" name="confirmPassword" class="form-control" id="confirmPassword" required>
                                                                                                    <div class="invalid-feedback">Confirma tu contraseña</div>
                                                                                            </div>

                                                                                            <div class="col-12 py-1">
                                                                                                <div class="form-check">
                                                                                                    <input class="form-check-input" name="terms" type="checkbox" value="" id="acceptTerms" required>
                                                                                                        <label class="form-check-label" for="acceptTerms">Acepto los términos y condiciones </label>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div class="col-12 py-1">
                                                                                                <button type="submit" class="btn c w-100"
                                                                                                        style="background-color: #9FAFE8; color: black; display: inline-block; width: 100%; text-align: center; text-decoration: none; padding: 10px;"><strong>Crear cuenta</strong></button>
                                                                                            </div>
                                                                                            <div class="col-12 py-2">
                                                                                                <p class="small mb-0">¿Ya tienes una cuenta? <a th:href="@{/login}">Iniciar Sesión</a>
                                                                                                </p>
                                                                                            </div>
                                                                                        </form>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>


                                                                    </div>

                                                                </main>

                                                                <!-- Vendor JS Files -->
                                                                <script th:src="@{/assets/vendor/apexcharts/apexcharts.min.js}"></script>
                                                                <script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
                                                                <script th:src="@{/assets/vendor/chart.js/chart.umd.js}"></script>
                                                                <script th:src="@{/assets/vendor/echarts/echarts.min.js}"></script>
                                                                <script th:src="@{/assets/vendor/quill/quill.min.js}"></script>
                                                                <script th:src="@{/assets/vendor/simple-datatables/simple-datatables.js}"></script>
                                                                <script th:src="@{/assets/vendor/tinymce/tinymce.min.js}"></script>
                                                                <script th:src="@{/assets/vendor/php-email-form/validate.js}"></script>

                                                                <!-- Template Main JS File -->
                                                                <script src="assets/js/main.js"></script>
                                                                <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


                                                                <script th:if="${param.success}">
                                                                    Swal.fire({
                                                                        icon: 'success',
                                                                        title: '¡Registro exitoso!',
                                                                        showConfirmButton: false,
                                                                        timer: 3000
                                                                    });
                                                                </script>
                                                            </body>

                                                            </html>
