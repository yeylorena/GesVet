<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"/>

<head th:replace="~{Plantillas/usuario :: head}"></head>

<body style="background-color: #F4F4F4;">

    <!-- ======= Header ======= -->
    <header th:replace="~{Plantillas/usuario :: header}"></header><!-- End Header -->

    <!-- ======= Sidebar ======= -->
    <aside th:replace="~{Plantillas/usuario :: sidebar}"></aside><!-- End Sidebar-->

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Servicio de citas</h1>
        </div><!-- End Page Title -->

        <section class="section profile">
            <div class="row">
                <div class="col-xl-12">

                    <div class="card">
                        <div class="card-body pt-3">
                            <!-- Bordered Tabs -->
                            <ul class="nav nav-tabs nav-tabs-bordered">

                                <li class="nav-item">
                                    <button class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#profile-edit">Solicitar cita</button>
                                </li>
                                <li class="nav-item">
                                    <button class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#profile-overview">Consultar citas</button>
                                </li>
                            </ul>
                            <div class="tab-content pt-2">
                                <div class="tab-pane fade show active profile-edit pt-3" id="profile-edit">

                                    <!--Solicitar cita-->
                                    <form id="agendarForm" method="post" action="/agendar">
                                        <div class="container-fluid">
                                            <div class="row">
                                                <!-- Columna del formulario -->
                                                <div class="col-8">
                                                    <div class="card-body"> 
                                                        <h6>Horario de atención:
                                                            Lunes a Sábado: 9:00 AM - 6:00 PM.</h6>
                                                        <div class="row">
                                                            <div class="col">
                                                                <br>
                                                                    <label for="mascota"><strong>Mascota:</strong></label>
                                                                    <select class="form-select" name="mascota" required>
                                                                        <option value="">Selecciona una mascota...</option>
                                                                        <option th:each="mascota : ${mascotas}" th:value="${mascota.id}" th:data-imagen="${mascota.imagen}" th:text="${mascota.nombre}" ></option>
                                                                    </select>
                                                            </div>
                                                            <div class="col">
                                                                <br>
                                                                    <label for="servicio"><strong>Tipo servicio:</strong></label>
                                                                    <select class="form-select" name="servicio" required>
                                                                        <option value="">Selecciona un servicio...</option>
                                                                        <option th:each="servicio : ${servicios}" th:value="${servicio.id}" th:data-precio="${servicio.precio}"
                                                                                th:text="${servicio.nombre}" ></option>                                                                    </select>
                                                            </div>
                                                        </div>
                                                        <div class="row">
                                                            <div class="col">
                                                                <br>
                                                                    <label for="usuario"><strong>Veterinario:</strong></label>
                                                                    <select class="form-select" name="usuario" required>
                                                                        <option value="">Selecciona un veterinario...</option>
                                                                        <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">
                                                                    </select>                                                                        </div>
                                                            <div class="col">
                                                                <br>
                                                                    <label for="precio"><strong>Precio:</strong></label>
                                                                    <input type="text" name="precio" class="form-control custom-border custom-bg-fondo" required readonly>
                                                                        <!-- El precio se autocompleta segun el servicio escogido -->
                                                                        </div>
                                                                        </div>
                                                                        <div class="row mt-3">
                                                                            <div class="col">
                                                                                <label class="control-label"><strong>Fecha</strong><span class="text-danger">*</span></label>
                                                                                <input type="datetime-local" name="inicio" id="fechaInicio" class="form-control" min="{{#temporal}}|format_date_time('yyyy-MM-ddTHH:mm'){{/temporal}}" required />
                                                                            </div>
                                                                        </div>
                                                                        <div th:if="${error != null}" class="alert alert-danger mt-3" role="alert">
                                                                            <strong>Error:</strong> <span th:text="${error}"></span>
                                                                        </div>

                                                                        <div class="text-center mt-4">
                                                                            <button id="agendarButton" type="submit" class="btn btn-success" style="background-color: #2FD6B4;">Agendar</button>
                                                                        </div>
                                                                        </div>
                                                                        </div>
                                                                        <div class="col-4 calificar-container">
                                                                            <img id="imagenMascota" src="./img/perrodefecto.jpg" alt="Imagen del Veterinario" style="             border-radius: 50%;
                                                                                 max-width: 80%; /* Permitir que la imagen se expanda */
                                                                                 object-fit: cover; /* Evitar que la imagen se distorsione */
                                                                                 height: 200px">
                                                                        </div>
                                                                        </div>
                                                                        </div>
                                                                        </form>
                                                                        </div>



                                                                        <div class="tab-pane fade  profile-overview" id="profile-overview">
                                                                            <!--Consultar citas-->
                                                                            <br>
                                                                                <div class="search-bar">
                                                                                    <form class="search-form d-flex align-items-center">
                                                                                        <input type="text" name="query" placeholder="Buscar mascota"
                                                                                               title="Enter search keyword">
                                                                                            <button type="submit" title="Search"><i class="bi bi-search"></i></button>
                                                                                    </form>
                                                                                </div>
                                                                                <br><!-- End Search Bar -->



                                                                                    <table class="table table-striped table-hover text-start">
                                                                                        <thead>
                                                                                            <tr class="table-secondary">
                                                                                                <th scope="col">N°</th>
                                                                                                <th scope="col">Mascota</th>
                                                                                                <th scope="col">Fecha</th>                                                                             
                                                                                                <th scope="col">Tipo de cita</th>
                                                                                                <th scope="col">Veterinario</th>
                                                                                                <th scope="col">Estado</th>
                                                                                            </tr>
                                                                                        </thead>
                                                                                        <tbody>
                                                                                            <tr th:each="cita, iterStat : ${citasPendientes}">
                                                                                                <td th:text="${iterStat.index + 1}"></td>
                                                                                                <td th:text="${cita.nombreMascota}"></td> <!-- Mostrar el nombre de la mascota -->
                                                                                                <td th:text="${cita.formattedFecha}"></td>
                                                                                                <td th:text="${cita.nombreCita}"></td> <!-- Mostrar el tipo de cita -->
                                                                                                <td th:text="${cita.nombreVeterinario}"></td> <!-- Mostrar el nombre del veterinario -->
                                                                                                <td style="color: red"  th:text="${cita.estado}"></td> <!-- Mostrar el estado de la cita -->
                                                                                            </tr>
                                                                                        </tbody>
                                                                                    </table>


                                                                                    </div>
                                                                                    <!--Fin consultar citas-->


                                                                                    </div><!-- End Bordered Tabs -->
                                                                                    </div>
                                                                                    </div>
                                                                                    </div>
                                                                                    </section>
                                                                                    <div th:replace="~{Plantillas/usuario :: scripts}"></div>


                                                                                    </main><!-- End #main -->
                                                                                    <script th:if="${success}">
                                                                                        Swal.fire({
                                                                                            icon: 'success',
                                                                                            title: '¡Cita agendada!',
                                                                                            text: 'La cita se ha agendado correctamente.'
                                                                                        });
                                                                                    </script>
                                                                                    <script>
                                                                                        document.addEventListener('DOMContentLoaded', function () {
                                                                                            // Obtener el selector de servicios
                                                                                            var servicioSelect = document.querySelector('select[name="servicio"]');
                                                                                            // Obtener el campo de precio
                                                                                            var precioInput = document.querySelector('input[name="precio"]');

                                                                                            // Manejar el evento de cambio en el selector de servicios
                                                                                            servicioSelect.addEventListener('change', function () {
                                                                                                // Obtener el precio del servicio seleccionado
                                                                                                var precio = parseFloat(this.options[this.selectedIndex].getAttribute('data-precio'));
                                                                                                // Comprobar si el precio es válido
                                                                                                if (!isNaN(precio)) {
                                                                                                    // Autocompletar el campo de precio
                                                                                                    precioInput.value = precio;
                                                                                                } else {
                                                                                                    // Limpiar el campo de precio si no se encuentra un precio válido
                                                                                                    precioInput.value = '';
                                                                                                }
                                                                                            });
                                                                                        });
                                                                                    </script>


                                                                                    <script>
                                                                                        document.addEventListener('DOMContentLoaded', function () {
                                                                                            // Obtener el selector de mascotas
                                                                                            var mascotaSelect = document.querySelector('select[name="mascota"]');
                                                                                            // Obtener la imagen de la mascota
                                                                                            var imagenMascota = document.getElementById('imagenMascota');

                                                                                            // Función para mostrar la imagen de la mascota seleccionada o la imagen por defecto
                                                                                            function mostrarImagenMascota() {
                                                                                                // Obtener la opción seleccionada
                                                                                                var selectedOption = mascotaSelect.options[mascotaSelect.selectedIndex];
                                                                                                // Obtener el nombre de la imagen de la mascota
                                                                                                var imagenNombre = selectedOption.getAttribute('data-imagen');

                                                                                                // Si hay un nombre de imagen, mostrar la imagen correspondiente
                                                                                                if (imagenNombre) {
                                                                                                    // Construir la URL completa de la imagen
                                                                                                    var imagenUrl = '/images/' + imagenNombre;
                                                                                                    // Establecer la URL de la imagen en el elemento img
                                                                                                    imagenMascota.src = imagenUrl;
                                                                                                } else {
                                                                                                    // Si no hay nombre de imagen (por ejemplo, opción vacía), mostrar la imagen por defecto
                                                                                                    imagenMascota.src = './img/perrodefecto.jpg';
                                                                                                }
                                                                                            }

                                                                                            // Manejar el evento de cambio en el selector de mascotas
                                                                                            mascotaSelect.addEventListener('change', mostrarImagenMascota);

                                                                                            // Mostrar la imagen de la mascota al cargar la página
                                                                                            mostrarImagenMascota();
                                                                                        });
                                                                                    </script>


                                                                                    </body>

                                                                                    </html>
