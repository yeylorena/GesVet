<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"/>

<head th:replace="~{Plantillas/administrador :: head}">
    <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.10.0/main.css' rel='stylesheet' />
    <script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.10.0/main.js'></script>
    <!-- Incluye el paquete de idioma de FullCalendar en español -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.10.0/locales/es.js'></script>
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FullCalendar CSS -->



</head>

<body style="background-color: #5DADE2;">

    <!-- ======= Header ======= -->
    <header th:replace="~{Plantillas/administrador :: header}"></header><!-- End Header -->

    <!-- ======= Sidebar ======= -->
    <aside th:replace="~{Plantillas/administrador :: sidebar}"></aside><!-- End Sidebar-->

    <main id="main" class="main" >

        <div class="pagetitle">
            <h1>Citas Rápidas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="inicio_vet.html">Inicio</a></li>
                    <li class="breadcrumb-item">Citas Rápidas</li>

                </ol>
            </nav>
        </div><!-- End Page Title -->

        <section class="section profile">
            <div class="col-xl-12">

                <div class="card">
                    <div class="card-body pt-3">
                        <!-- Bordered Tabs -->
                        <ul class="nav nav-tabs nav-tabs-bordered">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#profile-rapida">Cita Rápida</button>
                            </li>

                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#facturas">Consultar Historial</button>
                            </li>

                        </ul>

                        <div class="tab-content pt-2">
                            <div class="tab-pane show active fade profile-edit pt-3" id="profile-rapida">

                                <!--agendar cita-->
                                <div class="container-fluid mt-3">
                                    <p style="background-color: #5DADE2;" class="textoNeon">Citas Rápidas</p>
                                </div>
                                <div class="container-fluid">
                                    <div class="table-responsive">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-lg-6 col-md-12">
                                                    <form method="post" action="/citasRapidas/guardar" class="search-form d-flex align-items-center pb-3">


                                                        <input type="text" name="query" placeholder="Buscar" title="Enter search keyword">

                                                            <button id="buscar" type="button" class="btn"><i class="bi bi-search"></i></button>

                                                            <input type="hidden" name="estado" value="pendiente">

                                                                <button type="button" class="btn btn-success" data-bs-toggle="modal"
                                                                        data-bs-target="#agregarProv">Agregar cita  <i class="bi bi-calendar-plus"></i></button>

                                                                <!-- Modal agregar veterinario-->
                                                                <div class="modal fade" id="agregarProv" data-bs-backdrop="static"
                                                                     data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel"
                                                                     aria-hidden="true">
                                                                    <div class="modal-dialog">
                                                                        <div class="modal-content">
                                                                            <div class="modal-header" style="background: #5DADE2;">
                                                                                <h1 class="modal-title fs-5" id="staticBackdropLabel" style="color: #000;">
                                                                                    Agregar
                                                                                    cita rapida</h1>
                                                                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                                                        aria-label="Close"></button>
                                                                            </div>
                                                                            <div class="modal-body">
                                                                                <!-- Contenido del formulario -->
                                                                                <div class="row">
                                                                                    <div class="col">
                                                                                        <br>
                                                                                            <label for="nombreCita"><strong>Nombre de la cita:</strong></label>
                                                                                            <input type="text" name="nombreCita" id="nombreCita"
                                                                                                   class="form-control custom-border custom-bg-fondo">
                                                                                                <span class="error-message"></span>

                                                                                                </div>
                                                                                                <div class="col">
                                                                                                    <br>
                                                                                                        <label for="usuario"><strong>Veterinario:</strong></label>
                                                                                                        <select id="usuario" name="usuario" class="form-select">
                                                                                                            <option value="">Seleccionar...</option>
                                                                                                            <!-- Iteramos sobre los usuarios y generamos las opciones del menú desplegable -->
                                                                                                            <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">

                                                                                                                <!-- Mostramos el nombre completo del usuario como texto de la opción -->
                                                                                                                <span ></span>
                                                                                                            </option>
                                                                                                        </select>
                                                                                                </div>
                                                                                                </div>
                                                                                                <div class="row">
                                                                                                    <div class="col">
                                                                                                        <br>
                                                                                                            <label for="especie"><strong>Tipo de mascota:</strong></label>
                                                                                                            <select name="especie" class="form-select">
                                                                                                                <option value="">Selecciona una especie</option>
                                                                                                                <option th:each="especie : ${especies}" th:value="${especie.id}"
                                                                                                                        th:text="${especie.nombre}"></option>
                                                                                                            </select>
                                                                                                    </div>
                                                                                                    <div class="col">
                                                                                                        <br>
                                                                                                            <label for="nombreMascota"><strong>Nombre de la mascota:</strong></label>
                                                                                                            <input type="text" name="nombreMascota" id="nombreMascota"
                                                                                                                   class="form-control custom-border custom-bg-fondo">
                                                                                                                <span class="error-message"></span>

                                                                                                                </div>
                                                                                                                </div>
                                                                                                                <div class="row">

                                                                                                                    <div class="col">
                                                                                                                        <br>
                                                                                                                            <label for="nombreDueño"><strong>Nombre del dueño:</strong></label>
                                                                                                                            <input type="text" name="nombreDueño" id="nombreDueño"
                                                                                                                                   class="form-control custom-border custom-bg-fondo">
                                                                                                                                <span class="error-message"></span>

                                                                                                                                </div>
                                                                                                                                <div class="col">
                                                                                                                                    <br>
                                                                                                                                        <label for="colorMascota"><strong>color:</strong></label>
                                                                                                                                        <select class="form-select show-tick" name="colorMascota" id="colorMascota">
                                                                                                                                            <option value="">-- Seleccione el color --</option>
                                                                                                                                            <option style="color:#FF8C00;" value="#FF8C00">&#9724; Naranja</option>
                                                                                                                                            <option style="color:#e1ff00;" value="#e1ff00">&#9724; Amarillo</option>
                                                                                                                                            <option style="color:#ff0000;" value="#ff0000">&#9724; Rojo</option>
                                                                                                                                            <option style="color:#66ff00;" value="#66ff00">&#9724; Verde</option>
                                                                                                                                            <option style="color:#00ffd5;" value="#00ffd5">&#9724; Celeste</option>
                                                                                                                                            <option style="color:#ff00b3;" value="#ff00b3">&#9724; Morado</option>

                                                                                                                                        </select>
                                                                                                                                </div>
                                                                                                                                </div>
                                                                                                                                <div class="row">
                                                                                                                                    <div class="col">
                                                                                                                                        <br>
                                                                                                                                            <label for="precio"><strong>Precio:</strong></label>
                                                                                                                                            <input type="double" name="precio" id="precio"
                                                                                                                                                   class="form-control custom-border custom-bg-fondo">
                                                                                                                                                <span class="error-message"></span>

                                                                                                                                                </div>
                                                                                                                                                <div class="col">
                                                                                                                                                    <br>
                                                                                                                                                        <label class="control-label"><strong>Fecha de inicio</strong><span class="text-danger">*</span></label>
                                                                                                                                                        <input type="datetime-local" name="inicio" id="fechaInicio" class="form-control" min="{{#temporal}}|format_date_time('yyyy-MM-ddTHH:mm'){{/temporal}}" required />
                                                                                                                                                </div>
                                                                                                                                                </div>
                                                                                                                                                <!-- <div id="error-message" style="display: none;" class="alert alert-danger" role="alert">
                                                                                                                                                                                                        La cita no está disponible para el veterinario en el momento especificado.
                                                                            
                                                                                                                                                                                                        <span th:if="${error}" th:text="${error}"></span>
                                                                                                                                                                                                        </div>-->  

                                                                                                                                                </div>
                                                                                                                                                <div class="modal-footer" style="background: #5DADE2;">
                                                                                                                                                    <button type="button" class="btn btn-secondary"
                                                                                                                                                            data-bs-dismiss="modal">Cancelar</button>
                                                                                                                                                    <button id="btnGuardar" type="submit" class="btn btn-success">Agregar</button>
                                                                                                                                                </div>

                                                                                                                                                </div>
                                                                                                                                                </div>
                                                                                                                                                </div>
                                                                                                                                                <!-- Fin modal agendar -->
                                                                                                                                                </form>

                                                                                                                                                </div>
                                                                                                                                                </div>

                                                                                                                                                <!-- Inicio Tabla -->
                                                                                                                                                <table id="tabla-listar" class="table table-striped table-hover text-start">
                                                                                                                                                    <thead>
                                                                                                                                                        <tr class="table-secondary">
                                                                                                                                                            <th scope="col">N°</th>
                                                                                                                                                            <th scope="col">Dueño</th>
                                                                                                                                                            <th scope="col">Veterinario</th>
                                                                                                                                                            <th scope="col">Cita</th>
                                                                                                                                                            <th scope="col">Mascota</th>
                                                                                                                                                            <th scope="col">Tipo</th>                                                                                                                                                                   
                                                                                                                                                            <th scope="col">Precio</th>
                                                                                                                                                            <th scope="col">Fecha inicio</th>
                                                                                                                                                            <th scope="col">Estado</th>
                                                                                                                                                            <th scope="col">Opción</th>

                                                                                                                                                        </tr>
                                                                                                                                                    </thead>
                                                                                                                                                    <tbody>
                                                                                                                                                        <tr th:each="citas,iterStat : ${listadoCitas} "> <!-- "citas" es la variable que recibe cada uno de los onbjetos de la lista mandados desde el backend con la variable llamada listadoCitas -->
                                                                                                                                                            <td th:text="${iterStat.index + 1}"></td>
                                                                                                                                                            <td th:text="${citas.nombreDueño}"></td>
                                                                                                                                                            <td th:text="${citas.nombreVeterinario}"></td> <!-- Mostrar el nombre del veterinario -->
                                                                                                                                                            <td th:text="${citas.nombreCita}"></td>
                                                                                                                                                            <td th:text="${citas.nombreMascota}"></td>
                                                                                                                                                            <td th:text="${citas.especie.nombre}"></td>
                                                                                                                                                            <td th:text="${citas.precio}"></td>
                                                                                                                                                            <td th:text="${citas.formattedFecha}"></td>
                                                                                                                                                            <td th:text="${citas.estado}" th:classappend="${citas.estado eq 'completado' ? 'text-success' : 'text-danger' }"></td>
                                                                                                                                                            <td>
                                                                                                                                                                <a  th:href="@{'/citasRapidas/finalizar/' + ${citas.id}}" class="btn btn-primary">Finalizado</a>
                                                                                                                                                            </td>
                                                                                                                                                        </tr>
                                                                                                                                                    </tbody>
                                                                                                                                                </table>
                                                                                                                                                </div>
                                                                                                                                                </div>
                                                                                                                                                <div id='calendar'></div>
                                                                                                                                                </div>
                                                                                                                                                </div>
                                                                                                                                                <!--Fin solicitar cita-->

                                                                                                                                                <!--historial-->
                                                                                                                                                <div class="tab-pane fade pt-3" id="facturas">
                                                                                                                                                    <div class="container-fluid mt-3">
                                                                                                                                                        <p style="background-color: #5DADE2;" class="textoNeon">Historial citas rapidas</p>
                                                                                                                                                    </div>
                                                                                                                                                    <div class="container-fluid">
                                                                                                                                                        <div class="table-responsive">
                                                                                                                                                            <div class="card-body">
                                                                                                                                                                <div class="row">
                                                                                                                                                                    <div class="search-bar">
                                                                                                                                                                        <form class="search-form d-flex align-items-center" method="POST" action="#">
                                                                                                                                                                            <input type="date" name="date"  title="Enter search keyword">
                                                                                                                                                                                <button class="btn" type="submit" title="Search"><i class="bi bi-search"></i></button>
                                                                                                                                                                        </form>
                                                                                                                                                                    </div>
                                                                                                                                                                    <br>
                                                                                                                                                                        <!-- Inicio tabla histotial -->
                                                                                                                                                                        <table id="tabla-historial" class="table table-striped table-hover text-start">
                                                                                                                                                                            <thead>
                                                                                                                                                                                <tr class="table-secondary">
                                                                                                                                                                                    <th scope="col">N°</th>
                                                                                                                                                                                    <th scope="col">Dueño</th>
                                                                                                                                                                                    <th scope="col">Cita</th>
                                                                                                                                                                                    <th scope="col">Mascota</th>
                                                                                                                                                                                    <th scope="col">Tipo</th>
                                                                                                                                                                                    <th scope="col">Precio</th>
                                                                                                                                                                                    <th scope="col">Fecha inicio</th>
                                                                                                                                                                                    <th scope="col">Fecha Fin</th>
                                                                                                                                                                                    <th scope="col">Estado</th>
                                                                                                                                                                                </tr>
                                                                                                                                                                            </thead>
                                                                                                                                                                            <tbody>
                                                                                                                                                                                <tr th:each="citas,iterStat : ${listadoCitas}">
                                                                                                                                                                                    <td th:text="${iterStat.index + 1}"></td>
                                                                                                                                                                                    <td th:text="${citas.nombreDueño}"></td>
                                                                                                                                                                                    <td th:text="${citas.nombreCita}"></td>
                                                                                                                                                                                    <td th:text="${citas.nombreMascota}"></td>
                                                                                                                                                                                    <td th:text="${citas.especie.nombre}"></td>
                                                                                                                                                                                    <td th:text="${citas.precio}"></td>
                                                                                                                                                                                    <td th:text="${citas.formattedFecha}"></td>
                                                                                                                                                                                    <td th:text="${citas.formattedFechaFin}"></td>
                                                                                                                                                                                    <td style="color: green" th:text="${citas.estado}"></td>
                                                                                                                                                                                </tr>
                                                                                                                                                                            </tbody>
                                                                                                                                                                        </table>
                                                                                                                                                                </div>
                                                                                                                                                            </div>
                                                                                                                                                        </div>

                                                                                                                                                    </div>
                                                                                                                                                </div>
                                                                                                                                                <!-- Fin historial -->

                                                                                                                                                </div><!-- End tab content -->

                                                                                                                                                </div><!-- End card body -->
                                                                                                                                                </div><!-- End card -->
                                                                                                                                                </div> <!-- col-xl-12 -->  
                                                                                                                                                </section>
                                                                                                                                                <div th:replace="~{Plantillas/administrador :: scripts}"></div>

                                                                                                                                                </main><!-- End #main -->

                                                                                                                                                <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

                                                                                                                                                <script th:if="${error !=null}">
Swal.fire({
    icon: 'error',
    title: 'Error',
    text: 'La cita no está disponible para el veterinario en el momento especificado.'
});

                                                                                                                                                </script>
                                                                                                                                                <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.10.1/main.min.css' rel='stylesheet' />


                                                                                                                                                <script src='https://cdn.jsdelivr.net/npm/fullcalendar/index.global.min.js'></script>

                                                                                                                                                <script>

document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es', // Establece el idioma en español
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
            today: 'Hoy',
            month: 'Mes',
            week: 'Semana',
            day: 'Día'
        }
    });
    calendar.render();
});
                                                                                                                                                </script>

                                                                                                                                                <script>
                                                                                                                                                    document.addEventListener('DOMContentLoaded', function () {
                                                                                                                                                        // Función para validar y guardar la cita
                                                                                                                                                        document.getElementById('btnGuardar').addEventListener('click', function () {
                                                                                                                                                            var nombreCita = document.getElementById("nombreCita").value;
                                                                                                                                                            var veterinario = document.getElementById("usuario").value;
                                                                                                                                                            var especie = document.getElementsByName("especie")[0].value;
                                                                                                                                                            var nombreMascota = document.getElementById("nombreMascota").value;
                                                                                                                                                            var nombreDueño = document.getElementById("nombreDueño").value;
                                                                                                                                                            var colorMascota = document.getElementById("colorMascota").value;
                                                                                                                                                            var precio = document.getElementById("precio").value;
                                                                                                                                                            var fechaInicio = document.getElementById("fechaInicio").value;
                                                                                                                                                            if (nombreCita === "" || veterinario === "" || especie === "" || nombreMascota === "" || nombreDueño === "" || colorMascota === "" || precio === "" || fechaInicio === "") {
                                                                                                                                                                Swal.fire({
                                                                                                                                                                    icon: 'error',
                                                                                                                                                                    title: 'Error',
                                                                                                                                                                    text: 'Por favor, completa todos los campos antes de agregar la cita.'
                                                                                                                                                                });
                                                                                                                                                            } else {
                                                                                                                                                                var citaGuardada = true;
                                                                                                                                                                if (citaGuardada) {
                                                                                                                                                                    Swal.fire({
                                                                                                                                                                        icon: 'success',
                                                                                                                                                                        title: 'Cita creada con éxito',
                                                                                                                                                                        text: 'Tu cita ha sido guardada exitosamente.',
                                                                                                                                                                        showConfirmButton: false,
                                                                                                                                                                        timer: 2000
                                                                                                                                                                    });
                                                                                                                                                                }
                                                                                                                                                            }
                                                                                                                                                        });
                                                                                                                                                        // Validación en tiempo real y capitalización de campos
                                                                                                                                                        var precioInput = document.getElementById("precio");
                                                                                                                                                        var nombreCitaInput = document.getElementById("nombreCita");
                                                                                                                                                        var nombreMascotaInput = document.getElementById("nombreMascota");
                                                                                                                                                        var nombreDueñoInput = document.getElementById("nombreDueño");
                                                                                                                                                        precioInput.addEventListener('keydown', function (event) {
                                                                                                                                                            if (!(event.key === '.' || event.key === 'Backspace' || event.key === 'Delete' || (event.key >= '0' && event.key <= '9') ||
                                                                                                                                                                    (event.ctrlKey && event.key === 'a') || (event.ctrlKey && event.key === 'c') || (event.ctrlKey && event.key === 'x') ||
                                                                                                                                                                    (event.ctrlKey && event.key === 'v') || (event.key === 'ArrowLeft') || (event.key === 'ArrowRight') || (event.key === 'Tab') ||
                                                                                                                                                                    (event.key === 'Home') || (event.key === 'End'))) {
                                                                                                                                                                event.preventDefault();
                                                                                                                                                            }
                                                                                                                                                        });
                                                                                                                                                        nombreCitaInput.addEventListener('input', function () {
                                                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                                                        });
                                                                                                                                                        nombreMascotaInput.addEventListener('input', function () {
                                                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                                                        });
                                                                                                                                                        nombreDueñoInput.addEventListener('input', function () {
                                                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                                                        });
                                                                                                                                                        // Restablecer valores al cerrar el modal
                                                                                                                                                        $('#agregarProv').on('hidden.bs.modal', function (e) {
                                                                                                                                                            $('#nombreCita').val('');
                                                                                                                                                            $('#nombreMascota').val('');
                                                                                                                                                            $('#nombreDueño').val('');
                                                                                                                                                            $('#usuario').prop('selectedIndex', 0);
                                                                                                                                                            $('#especie').prop('selectedIndex', 0);
                                                                                                                                                            $('#colorMascota').prop('selectedIndex', 0);
                                                                                                                                                            $('#precio').val('');
                                                                                                                                                            $('#fechaInicio').val('');
                                                                                                                                                            $('.error-message').text('');
                                                                                                                                                        });
                                                                                                                                                    });
                                                                                                                                                </script>

                                                                                                                                                </body>
                                                                                                                                                </html>
