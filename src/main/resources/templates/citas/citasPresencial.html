                                                                                                                <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.10.1/main.min.css' rel='stylesheet' />

                                                                                                                <script>
document.getElementById('btnGuardar').addEventListener('click', function () {
// Obtener los datos del formulario
    var nombreCita = document.getElementById('nombreCita').value;
    var colorCita = document.getElementById('colorMascota').value;
    var inicio = document.getElementById('fechaInicio').value;

// Realizar una solicitud AJAX para guardar la cita
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/citasRapidas/guardar', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function () {
        if (xhr.readyState === XMLHttpRequest.DONE) {
            if (xhr.status === 200) {
                // La cita se guardó correctamente, actualizar el FullCalendar
                actualizarCalendario();
            } else {
                // Hubo un error al guardar la cita
                console.error('Error al guardar la cita:', xhr.responseText);
            }
        }
    };
// Enviar los datos del formulario al servidor
    xhr.send('nombreCita=' + encodeURIComponent(nombreCita) + '&colorMascota=' + encodeURIComponent(colorCita) + '&inicio=' + encodeURIComponent(inicio));
});

// Función para actualizar el FullCalendar con los eventos de las citas guardadas
function actualizarCalendario() {
// Realizar una solicitud AJAX para obtener la lista de eventos
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/citasRapidas/eventos', true);
    xhr.onreadystatechange = function () {
        if (xhr.readyState === XMLHttpRequest.DONE) {
            if (xhr.status === 200) {
                // Parsear la respuesta JSON con los eventos
                var eventos = JSON.parse(xhr.responseText);
                // Limpiar el calendario
                calendar.removeAllEvents();
                // Agregar los eventos al calendario
                calendar.addEventSource(eventos);
            } else {
                // Hubo un error al obtener los eventos
                console.error('Error al obtener los eventos:', xhr.responseText);
            }
        }
    };
// Enviar la solicitud GET para obtener los eventos
    xhr.send();
}

document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        dateClick: function (info) {
            // info.date contiene la fecha seleccionada por el usuario
            // Puedes usar esta fecha para mostrarla en algún campo de tu formulario
            document.getElementById('fechaInicio').value = info.date.toISOString().slice(0, 16);
        }
    });

    calendar.render();
});



                                                                                                                </script>


                                                                                                                <script>
                                                                                                                    document.addEventListener('DOMContentLoaded', function () {
                                                                                                                        // Función para validar y guardar la cita
                                                                                                                        document.getElementById('btnGuardar').addEventListener('click', function () {
                                                                                                                            var nombreCita = document.getElementById("nombreCita").value;
                                                                                                                            var veterinario = document.getElementById("usuario").value;
                                                                                                                            var especie = document.getElementsByName("especie")[0].value;
                                                                                                                            var nombreMascota = document.getElementById("nombreMascota").value;
                                                                                                                            var nombreDueño = document.getElementById("nombreDueño").value;
                                                                                                                            var colorMascota = document.getElementById("colorMascota").value;
                                                                                                                            var precio = document.getElementById("precio").value;
                                                                                                                            var fechaInicio = document.getElementById("fechaInicio").value;
                                                                                                                            if (nombreCita === "" || veterinario === "" || especie === "" || nombreMascota === "" || nombreDueño === "" || colorMascota === "" || precio === "" || fechaInicio === "") {
                                                                                                                                Swal.fire({
                                                                                                                                    icon: 'error',
                                                                                                                                    title: 'Error',
                                                                                                                                    text: 'Por favor, completa todos los campos antes de agregar la cita.'
                                                                                                                                });
                                                                                                                            } else {
                                                                                                                                var citaGuardada = true;
                                                                                                                                if (citaGuardada) {
                                                                                                                                    Swal.fire({
                                                                                                                                        icon: 'success',
                                                                                                                                        title: 'Cita creada con éxito',
                                                                                                                                        text: 'Tu cita ha sido guardada exitosamente.',
                                                                                                                                        showConfirmButton: false,
                                                                                                                                        timer: 2000
                                                                                                                                    });
                                                                                                                                }
                                                                                                                            }
                                                                                                                        });
                                                                                                                        // Validación en tiempo real y capitalización de campos
                                                                                                                        var precioInput = document.getElementById("precio");
                                                                                                                        var nombreCitaInput = document.getElementById("nombreCita");
                                                                                                                        var nombreMascotaInput = document.getElementById("nombreMascota");
                                                                                                                        var nombreDueñoInput = document.getElementById("nombreDueño");
                                                                                                                        precioInput.addEventListener('keydown', function (event) {
                                                                                                                            if (!(event.key === '.' || event.key === 'Backspace' || event.key === 'Delete' || (event.key >= '0' && event.key <= '9') ||
                                                                                                                                    (event.ctrlKey && event.key === 'a') || (event.ctrlKey && event.key === 'c') || (event.ctrlKey && event.key === 'x') ||
                                                                                                                                    (event.ctrlKey && event.key === 'v') || (event.key === 'ArrowLeft') || (event.key === 'ArrowRight') || (event.key === 'Tab') ||
                                                                                                                                    (event.key === 'Home') || (event.key === 'End'))) {
                                                                                                                                event.preventDefault();
                                                                                                                            }
                                                                                                                        });
                                                                                                                        nombreCitaInput.addEventListener('input', function () {
                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                        });
                                                                                                                        nombreMascotaInput.addEventListener('input', function () {
                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                        });
                                                                                                                        nombreDueñoInput.addEventListener('input', function () {
                                                                                                                            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
                                                                                                                            this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
                                                                                                                        });
                                                                                                                        // Restablecer valores al cerrar el modal
                                                                                                                        $('#agregarProv').on('hidden.bs.modal', function (e) {

                                                                                                                            $('#nombreMascota').val('');
                                                                                                                            $('#nombreDueño').val('');

                                                                                                                            $('#especie').prop('selectedIndex', 0);
                                                                                                                            $('#colorMascota').prop('selectedIndex', 0);
                                                                                                                            $('#precio').val('');
                                                                                                                            $('#fechaInicio').val('');

                                                                                                                        });
                                                                                                                    });
