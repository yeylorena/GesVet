<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"/>

<head th:replace="Plantillas/usuario :: head"></head>

<body>

    <header th:replace="Plantillas/usuario :: header"></header> 

    <aside th:replace="Plantillas/usuario :: sidebar"></aside>

    <main id="main" class="main" style="background-color: #403a3a">

        <div class="pagetitle">
            <h1 style="color: white;">Productos y Servicios</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#" style="color: white;">Inicio</a></li>
                    <li class="breadcrumb-item" style="color: white;">Productos y Servicios</li>
                    <li class="breadcrumb-item active" style="color: white;">Detalle</li>
                </ol>
            </nav>
        </div><!-- End Page Title -->

        <section class="section profile">
            <div class="col-xl-12">

                <div class="card">
                    <div class="card-body pt-3">
                        <!-- Bordered Tabs -->
                        <ul class="nav nav-tabs nav-tabs-bordered">

                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab"
                                        data-bs-target="#profile-overview">Ver detalle</button>
                            </li>
                        </ul>
                        <div class="tab-content pt-2">

                            <div class="container-fluid mt-2">
                                <p class="textoNeonU">Detalle Producto / Servicio</p>
                            </div>



                            <div class="row mt-5">


                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <a href="#"> <img class="img-fluid rounded" th:src="@{/images/{img} (img=${producto.imagen})}" alt=""></a>
                                        </div>
                                        <div class="col-lg-6">
                                            <form th:action="@{/cart}" method="POST">
                                                <input type="hidden" th:value="${producto.id}" name="id"><!-- campo oculto -->
                                                    <h2 class="card-title" th:text="${producto.nombre}"></h2>
                                                    <ul class="list-group">
                                                        <li class="list-group-item"><h5 th:text=" 'Precio: ' + ${producto.precio}"></h5></li>
                                                        <li class="list-group-item"><p th:text=" 'Descripción: ' + ${producto.descripcion}"></p>
                                                        </li>
                                                        <li class="list-group-item"><h6>
                                                                Cantidad: <input type="number" id="cantidad" name="cantidad"
                                                                                 autocomplete="off" min="1" max="5" value="1">
                                                            </h6></li>
                                                    </ul>


                                                    <button type="submit" class="btn btn-dark">Añadir al
                                                        carrito</button>

                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>

            </div>
            </div>
            </div>
        </section>

        <div th:replace="Plantillas/usuario :: scripts"></div>

    </main><!-- End #main -->
</body>
</html>
