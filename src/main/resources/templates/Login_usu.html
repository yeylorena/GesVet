<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">

        <title> Usuario/Login</title>
        <meta content="" name="description">
        <meta content="" name="keywords">

        <!-- Google Fonts -->
        <link href="https://fonts.gstatic.com" rel="preconnect">
        <link
            href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
            rel="stylesheet">

        <!-- Favicons -->
        <link href="../img/productos_servicios/logo.png" rel="icon">

        <!-- Vendor CSS Files -->
        <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
        <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
        <link href="assets/vendor/quill/quill.snow.css" rel="stylesheet">
        <link href="assets/vendor/quill/quill.bubble.css" rel="stylesheet">
        <link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
        <link href="assets/vendor/simple-datatables/style.css" rel="stylesheet">

        <!-- Template Main CSS File -->
        <link href="assets/css/style.css" rel="stylesheet">


    </head>

    <body style="background-color: #9FAFE8;">
        <main>
            <div class="container-fluid py-5">

                <div class="row col-md-12 justify-content-center ">

                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center ">

                        <div class="card mb-3 ">
                            <div class="card-body " style="width: 400px; background: #FFFFFF;
                                 border: 1px solid #000000;
                                 box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
                                 ">
                                <div class="col-12 py-1 d-flex align-items-center my-1">
                                    <img src="./img/image 14.png" alt=""
                                         style="width: 80px; margin-right: 15px; margin-bottom: 15px;">
                                    <div>
                                        <h4 class="card-title fs-4 justify-content-between ">Inicio de Sesión</h4>
                                    </div>
                                </div>
                                <p class="text-center small ustify-content-between mb-0">Ingrese tu email y contraseña</p>

                                <form  method="post"
                                       role="form"
                                       th:action="@{/login}"
                                       th:object="${user}"
                                       class="row g-3 needs-validation py-2" novalidate>
                                    <div class="col-12 py-2">
                                        <label for="yourName" class="form-label">Email</label>
                                        <input th:field="*{username}" type="text" name="name" class="form-control" id="yourName" required>
                                        <div class="invalid-feedback">Escribe un nombre de usuario</div>
                                    </div>
                                    <div class="col-12 py-2">
                                        <label for="yourPassword" class="form-label">Contraseña</label>
                                        <input th:field="*{password}" type="password" name="password" class="form-control" id="yourPassword" required>
                                        <div class="invalid-feedback">Escribe tu contraseña</div>
                                    </div>
                                    <div class="col-12 py-2">
                                        <div class="form-check">
                                            <input class="form-check-input" name="terms" type="checkbox" value="" id="acceptTerms" required>
                                            <label class="form-check-label" for="acceptTerms">Recordarme </label>
                                        </div>
                                    </div>
                                    <div class="col-12 py-2">
                                        <button type="submit"  class="btn c w-100"
                                                style="background-color: #9FAFE8; color: black; display: inline-block; width: 100%; text-align: center; text-decoration: none; padding: 10px;">Ingresar</button>
                                    </div>
                                    <div class="col-12 py-2">
                                        <p class="small mb-0">¿Olvidaste tu contraseña? <a th:href="@{/password-request}">Recuperar contraseña</a>
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>


            </div>

        </main>

        <!-- Vendor JS Files -->
        <script src="assets/vendor/apexcharts/apexcharts.min.js"></script>
        <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="assets/vendor/chart.js/chart.umd.js"></script>
        <script src="assets/vendor/echarts/echarts.min.js"></script>
        <script src="assets/vendor/quill/quill.min.js"></script>
        <script src="assets/vendor/simple-datatables/simple-datatables.js"></script>
        <script src="assets/vendor/tinymce/tinymce.min.js"></script>
        <script src="assets/vendor/php-email-form/validate.js"></script>

        <!-- Template Main JS File -->
        <script src="assets/js/main.js"></script>
        <!-- SweetAlert CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

        <script th:if="${param.error}">
            Swal.fire({
                title: 'Error de inicio de sesión',
                text: 'Usuario o contraseña incorrectos',
                icon: 'error',
                confirmButtonText: 'Ok'
            });
        </script>
<script th:if="${param.logout}">
            Swal.fire({
                title: 'Sesión cerrada',
                text: 'GesVet',
                icon: 'success',
                confirmButtonText: 'Ok'
            });
        </script>




    </body>

</html>
